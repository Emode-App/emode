name: CI

# Nothing ran the test suite automatically until now. It exists because
# detection bugs on this codebase have historically survived review and shipped
# to real storefronts, and a suite nobody runs catches exactly as much as no
# suite at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an older run pointless. Cancel it rather than pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 rather than the 20 in the Shopify app's Dockerfile: the test
          # runner is invoked with a glob (`node --test "test/*.test.mjs"`),
          # which older runtimes do not expand.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build, lint and test
        # Placeholders, not real credentials. The web app reads env at module
        # scope, so `next build` needs these present to collect page data; it
        # never connects to anything during a build. Real values live in Vercel.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_EMODE_URL: https://www.emode.style
        run: npx turbo run build lint test

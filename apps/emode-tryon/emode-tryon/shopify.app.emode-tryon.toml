# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a8bdc109e414119e97ece1a0ab1b0df1"
name = "emodeAI"
application_url = "https://emode-tryon.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # GDPR/privacy compliance webhooks are mandatory for App Store review, but
  # they are NOT ordinary subscriptions — declaring them under
  # [[webhooks.subscriptions]] fails with "The following topic is invalid".
  # They belong in their own block, keyed by purpose rather than by topic name.
  #
  # `shopify app config link` and `--reset` wipe this along with access_scopes,
  # so re-check both sections after running either.
  # ── Try-on attribution — BLOCKED PENDING SHOPIFY APPROVAL ────────────────
  # orders/create and refunds/create are protected customer data topics.
  # `shopify app deploy` REJECTS the whole version while they are declared and
  # the app is unapproved ("This app is not approved to subscribe to webhook
  # topics containing protected customer data") — this is not merely a runtime
  # restriction, and it blocks development stores too.
  #
  # To enable: Partner dashboard -> this app -> API access -> Protected
  # customer data access -> request Level 1 plus the "Orders" data field,
  # stating the use case (attributing try-ons to purchases for merchant
  # analytics). Once approved, uncomment these and restore read_orders in
  # access_scopes below, then redeploy and re-authorize the app.
  #
  # The handlers already exist at app/routes/webhooks.orders.create.jsx and
  # webhooks.refunds.create.jsx, and visitor ids are already recorded on
  # generations and cart attributes, so switching this on is config-only.
  #
  # [[webhooks.subscriptions]]
  # topics = [ "orders/create" ]
  # uri = "/webhooks/orders/create"
  #
  # [[webhooks.subscriptions]]
  # topics = [ "refunds/create" ]
  # uri = "/webhooks/refunds/create"

  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# These are requested at install time. If this is empty when you install, the
# app gets granted nothing and syncProducts() in app/routes/app._index.jsx fails
# with a permissions error while everything else looks fine. `shopify app config
# link` and `--reset` both blank this out — re-check it after either.
# read_orders is removed until Shopify approves protected customer data access
# for this app — see the webhooks section above. Restore it to
# "write_products,read_products,read_orders" at the same time as the order
# webhooks; the app must then be re-authorized on each installed store.
# read_themes is read-only and used for exactly one thing: checking whether the
# emodeAI Buttons block is present in the live theme, so the dashboard can stop
# guessing from try-on counts and telling correctly-configured stores they are
# broken. See themeBlockInstalled() in app/routes/app._index.jsx.
scopes = "write_products,read_products,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://emode-tryon.fly.dev/auth/callback" ]

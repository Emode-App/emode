<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emodeAI Widget Test Page</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding: 4rem;
            background: #f5f5f5;
        }

        .product-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin: 0 auto;
        }

        .product-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .product-card h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        .product-card .price {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 2rem;
        }

        .add-to-cart {
            width: 100%;
            padding: 1rem;
            background: #0a0a0a;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=600&h=800&auto=format&fit=crop"
            alt="Midnight Blazer">
        <h1>Midnight Blazer</h1>
        <div class="price">$299.00</div>

        <!-- The emode buttons will be injected here by the widget script -->
        <button class="add-to-cart">Add to Cart</button>
    </div>

    <!-- emodeAI Universal Widget Script -->
    <!-- In a real scenario, src would be your production CDN link -->
    <script src="./apps/widget/dist/index.global.js" data-emode-merchant="test-merchant-id"
        data-product-selector=".product-card" data-image-selector=".product-card img"
        data-price-selector=".product-card .price"></script>

</body>

</html>
